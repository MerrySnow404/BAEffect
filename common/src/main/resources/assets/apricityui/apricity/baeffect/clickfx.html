<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="aui-font-mode" content="web">
    <meta name="aui-viewport" content="mode=gui">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }
        #baeffect-fx-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        #baeffect-phira-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
        #baeffect-trail-glow {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: visible;
            pointer-events: none;
        }
        #baeffect-debug-hud {
            position: absolute;
            left: 8px;
            top: 8px;
            display: none;
            padding: 3px 5px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.55);
            color: #7cf7ff;
            font-size: 5px;
            line-height: 1.4;
            white-space: pre;
            pointer-events: none;
        }
    </style>
</head>
<body style="transform: translateZ(9999px);">
<canvas id="baeffect-fx-canvas"></canvas>
<div id="baeffect-phira-layer"></div>
<div id="baeffect-trail-glow"></div>
<div id="baeffect-debug-hud"></div>
</body>
</html>
