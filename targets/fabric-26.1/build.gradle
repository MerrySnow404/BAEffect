plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). Everything without a
// confirmed version difference lives there, so its sources are compiled into
// this target by source-set sharing. Its shared resources directory is wired in
// by gradle/target-conventions/publish.gradle.
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        // Minecraft 1.21.1+ uses JOrbisAudioStream instead of OggAudioStream.
        exclude 'com/sighs/baeffect/OggDecoder.java'
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar', Jar).configure {
    dependsOn 'prepareCommonSources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Sighs"
        url = "https://maven.sighs.cc/repository/maven-public/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // 26.1 ships unobfuscated in official names.
    implementation "com.sighs:ApricityUI-fabric-${fabric_minecraft_version}:${apricityui_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version    : fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties
    // Named runtimes do not use the shared legacy refmap.
    inputs.property 'omitMixinRefmap', true
    filesMatching('baeffect.mixins.json') {
        filter { line -> line.trim().startsWith('"refmap":') ? null : line }
    }
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

apply from: file('../../gradle/target-conventions/publish.gradle')
