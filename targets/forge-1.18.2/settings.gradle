pluginManagement {
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    }
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = 'BAEffect-forge-1.18.2'

// Attach the shared source tree as a composite build so IDEs import common/ as
// a separate, independently-editable module. Targets compile common sources via
// source-set sharing; this include does not add a project dependency.
includeBuild('../../common')
